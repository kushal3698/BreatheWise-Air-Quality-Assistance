name: BreatheWise CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend Quality, Types, Coverage & E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run Frontend Vitest Suite with Coverage (85%+ Floor)
        env:
          DEMO_MODE: 'true'
        run: npm test -- --run --coverage

      - name: Dependency Vulnerability Audit (Production)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E + Axe Accessibility Spec
        env:
          DEMO_MODE: 'true'
        run: npm run test:e2e

  backend-ci:
    name: Backend Quality, Types, SAST & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov ruff black mypy bandit pip-audit

      - name: Lint and Format Check (ruff C901/S, black)
        run: |
          ruff check .
          black --check .

      - name: Strict Type Checking (Mypy)
        run: mypy --strict app/

      - name: Python SAST Security Scan (Bandit)
        run: bandit -r app/ -ll

      - name: Dependency Vulnerability Audit
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Run Pytest Test Suite (90%+ Coverage Floor)
        run: pytest -v --cov=app --cov-fail-under=90 tests/

  security-audit:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify No Google API Keys Committed
        run: |
          ! git grep -E "AIza[0-9A-Za-z_-]{35}" -- ':!.github'

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
