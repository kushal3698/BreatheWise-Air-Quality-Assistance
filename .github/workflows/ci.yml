name: BreatheWise CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-ci:
    name: Frontend Verification & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run Frontend Vitest Suite
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build

  backend-ci:
    name: Backend Pytest & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov ruff black

      - name: Lint and Format Check (ruff, black)
        run: |
          ruff check .
          black --check .

      - name: Run Pytest Test Suite with Coverage
        run: pytest -v --cov=app --cov-fail-under=70 tests/

  security-audit:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Secrets Committed
        run: |
          ! git grep -E "AIza[0-9A-Za-z_-]{35}" -- ':!.github'
