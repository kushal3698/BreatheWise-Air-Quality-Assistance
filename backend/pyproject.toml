[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E4/E7/E9: syntax errors, F: pyflakes, I: import sorting, C901: McCabe complexity <= 10, S: Bandit security rules
select = ["E4", "E7", "E9", "F", "I", "C901", "S"]
ignore = ["S101", "S104", "S311"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
